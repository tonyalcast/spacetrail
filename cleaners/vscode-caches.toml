schema = 1
id = "vscode-caches"
version = "1.0.0"
name = "VS Code caches"
description = "Chromium/Electron caches of VS Code: compiled code, GPU shaders, HTTP cache and downloaded extension packages."
risk = "safe"
risk_reason = "Pure caches; the editor rebuilds them on next start."
category = "developer/editors"
regenerates = "On next VS Code start (first start slightly slower)."

[measure]
paths = ["~/Library/Application Support/Code/Cache", "~/Library/Application Support/Code/CachedData", "~/Library/Application Support/Code/Code Cache", "~/Library/Application Support/Code/GPUCache", "~/Library/Application Support/Code/CachedExtensionVSIXs", "~/Library/Application Support/Code/CachedProfilesData", "~/Library/Application Support/Code/Service Worker/CacheStorage"]

[preconditions]
process_not_running = ["Visual Studio Code"]

[[action]]
type = "delete_contents"
