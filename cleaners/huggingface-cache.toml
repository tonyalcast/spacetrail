schema = 1
id = "huggingface-cache"
version = "1.1.0"
name = "Hugging Face models"
description = "Models and datasets downloaded by Hugging Face libraries."
risk = "manual"
risk_reason = "Models can be many GB to re-download; only you know which are in use."
category = "ai/models"

[measure]
paths = ["${HF_HOME:-~/.cache/huggingface}/hub/*"]

[[action]]
type = "manual"
instructions = """
List cached models and datasets, then remove the ones you no longer use with `hf cache rm` (the `huggingface-cli` command is deprecated). `hf cache prune` removes revisions no branch points to.
"""
suggested_commands = [
  ["hf", "cache", "ls"],
  ["hf", "cache", "rm", "model/<org>/<name>", "--yes"],
  ["hf", "cache", "prune"],
]
