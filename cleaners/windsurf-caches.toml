schema = 1
id = "windsurf-caches"
version = "1.0.0"
name = "Windsurf caches"
description = "Chromium/Electron caches of Windsurf: compiled code, GPU shaders, HTTP cache and downloaded extension packages."
risk = "safe"
risk_reason = "Pure caches; the editor rebuilds them on next start."
category = "developer/editors"
regenerates = "On next Windsurf start (first start slightly slower)."

[measure]
paths = ["~/Library/Application Support/Windsurf/Cache", "~/Library/Application Support/Windsurf/CachedData", "~/Library/Application Support/Windsurf/Code Cache", "~/Library/Application Support/Windsurf/GPUCache", "~/Library/Application Support/Windsurf/CachedExtensionVSIXs", "~/Library/Application Support/Windsurf/CachedProfilesData", "~/Library/Application Support/Windsurf/Service Worker/CacheStorage"]

[preconditions]
process_not_running = ["Windsurf"]

[[action]]
type = "delete_contents"
