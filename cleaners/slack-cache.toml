schema = 1
id = "slack-cache"
version = "1.0.0"
name = "Slack cache"
description = "Electron caches of the app (images, scripts, service workers)."
risk = "review"
risk_reason = "Re-downloaded as you use the app; messages stay on the server."
category = "apps/chat"
regenerates = "As you use the app."

[measure]
paths = ["~/Library/Application Support/Slack/Cache", "~/Library/Application Support/Slack/Code Cache", "~/Library/Application Support/Slack/GPUCache", "~/Library/Application Support/Slack/Service Worker/CacheStorage"]

[preconditions]
process_not_running = ["Slack"]

[[action]]
type = "delete_contents"
